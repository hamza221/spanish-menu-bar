name: SpanishWord
options:
  bundleIdPrefix: com.hamzamahjoubi
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
packages:
  SpanishMenuBar:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SpanishWord:
    type: application
    platform: iOS
    sources:
      - path: SpanishWord
      - path: Shared
    dependencies:
      - package: SpanishMenuBar
        product: SpanishMenuBarCore
      - target: SpanishWordWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzamahjoubi.SpanishWord
        PRODUCT_NAME: Spanish Word
        CODE_SIGN_ENTITLEMENTS: SpanishWord/SpanishWord.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SpanishWord/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  SpanishWordWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SpanishWordWidget
      - path: Shared
    dependencies:
      - package: SpanishMenuBar
        product: SpanishMenuBarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzamahjoubi.SpanishWord.Widget
        PRODUCT_NAME: Spanish Word Widget
        CODE_SIGN_ENTITLEMENTS: SpanishWordWidget/SpanishWordWidget.entitlements
        INFOPLIST_FILE: SpanishWordWidget/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  SpanishWordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpanishWordUITests
    dependencies:
      - target: SpanishWord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzamahjoubi.SpanishWordUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SpanishWord
schemes:
  SpanishWord:
    build:
      targets:
        SpanishWord: all
        SpanishWordWidget: all
        SpanishWordUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpanishWordUITests
    archive:
      config: Release
